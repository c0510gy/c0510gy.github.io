  <a class="skip-link" href="#main">Skip to content</a>
  <p id="content-loading" class="content-message" role="status">Loading profile…</p>
  <div id="content-error" class="content-message" role="alert" hidden>
    <p>The profile could not be loaded. Please try again.</p>
    <button id="content-retry" type="button">Retry</button>
    <a href="cv.html">View CV</a>
  </div>
  <noscript><style>#content-loading { display: none; }</style><p class="content-message">Please enable JavaScript to view this profile, or <a href="https://drive.google.com/file/d/1LhoWyRC6YKXsxjudRj8PFXEN6aSUfwJE/view">view the CV on Google Drive</a>.</p></noscript>
  <div class="page" id="profile-page" hidden>
    <header class="profile-header" id="top">
      <div class="profile-intro">
        <p class="profile-role" id="profile-role"></p>
        <h1 id="profile-name"></h1>
        <p class="name-variants" id="profile-name-variants"></p>
        <p class="affiliation" id="profile-affiliation"></p>
        <p class="lab-name" id="profile-lab"></p>
      </div>
      <div class="portrait" id="profile-portrait"></div>
      <nav class="profile-links" id="profile-links" aria-label="Contact and profiles"></nav>
    </header>
    <main id="main">
      <section id="about" aria-labelledby="about-title">
        <h2 id="about-title"></h2>
        <div id="about-content"></div>
      </section>
      <section id="research-interests" aria-labelledby="interests-title">
        <h2 id="interests-title"></h2>
        <ul class="interest-list" id="interest-list"></ul>
      </section>
      <section id="education" aria-labelledby="education-title">
        <h2 id="education-title"></h2>
        <div id="education-list"></div>
      </section>
      <section id="publications" aria-labelledby="publications-title">
        <h2 id="publications-title"></h2>
        <p class="publication-note"><span id="publication-summary"></span><span class="note-dot">·</span><span id="publication-note"></span></p>
        <div id="publication-list"></div>
      </section>
      <section id="honors" aria-labelledby="honors-title">
        <h2 id="honors-title"></h2>
        <ul class="honors-list" id="honors-list"></ul>
      </section>
    </main>
    <footer><a id="footer-email"></a><span>© <span id="copyright-year"></span> <span id="footer-name"></span></span></footer>
  </div>
</body>
